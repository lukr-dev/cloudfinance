name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: pnpm void prepare
      - run: vp check
      - run: vp run check
      - run: vp test
      - run: vp build
