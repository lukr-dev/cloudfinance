name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloudfinance.toastnet.work
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: pnpm void prepare
      - run: vp check
      - run: vp run check
      - run: vp test
      - run: vp build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          # Void 1.1.11 connect requires account discovery; CI already pins the account.
          mkdir -p .void
          printf '%s\n' '{"platform":"cloudflare"}' > .void/project.json
          pnpm void deploy --platform cloudflare </dev/null
      - name: Store the setup token as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          CI: "true"
        run: |
          : "${SETUP_TOKEN:?Set the SETUP_TOKEN repository secret}"
          printf '%s' "$SETUP_TOKEN" | pnpm void secret put SETUP_TOKEN
      - name: Upload void.lock.json
        if: always() && hashFiles('void.lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: void-lock
          path: void.lock.json
      - name: Remind to commit the lock
        if: always()
        run: |
          if ! git diff --quiet --exit-code -- void.lock.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard void.lock.json)" ]; then
            echo "::warning::void.lock.json changed. Download the void-lock artifact and commit it to dev."
          fi
