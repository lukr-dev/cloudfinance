name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloudfinance.toastnet.work
    steps:
      - uses: actions/checkout@v4
      - name: Require the first local deployment
        run: |
          if [ ! -s void.lock.json ]; then
            echo "::error::Run the first deployment locally and commit void.lock.json before deploying from CI."
            exit 1
          fi
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: pnpm void prepare
      - run: vp check
      - run: vp run check
      - run: vp test
      - run: vp build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          pnpm void deploy --platform cloudflare </dev/null
